<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Change your Petros Curious Mind account password.">

  <title>Change Password | Petros Curious Mind</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- NAVIGATION -->
  <header class="site-header">
  <a class="brand" href="index.html" aria-label="Petros Curious Mind home">
    <img src="images/logo.png" alt="Petros Curious Mind logo" class="brand-logo">
    <span>Petros Curious Mind</span>
  </a>
  <button class="menu-toggle" id="menuToggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="navigation">☰</button>
  <nav class="navigation" id="navigation" aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="stories.html">Stories</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="signin.html" class="nav-signin">Sign In</a>
  </nav>
</header>


  <!-- CHANGE PASSWORD -->
  <main class="page-container">

    <section class="page-header">

      <h1>Change Password</h1>

      <p>
        Keep your account secure by updating your password.
      </p>

    </section>


    <section class="content-section">

      <form id="password-form" class="form-card">

        <!-- CURRENT PASSWORD -->
        <div class="form-group">

          <label for="current-password">
            Current Password
          </label>

          <input
            type="password"
            id="current-password"
            name="currentPassword"
            autocomplete="current-password"
            required>

        </div>


        <!-- NEW PASSWORD -->
        <div class="form-group">

          <label for="new-password">
            New Password
          </label>

          <input
            type="password"
            id="new-password"
            name="newPassword"
            autocomplete="new-password"
            minlength="8"
            required>

        </div>


        <!-- CONFIRM NEW PASSWORD -->
        <div class="form-group">

          <label for="confirm-password">
            Confirm New Password
          </label>

          <input
            type="password"
            id="confirm-password"
            name="confirmPassword"
            autocomplete="new-password"
            minlength="8"
            required>

        </div>


        <!-- SHOW PASSWORD -->
        <div class="form-group">

          <label>
            <input
              type="checkbox"
              id="show-password">
            Show Passwords
          </label>

        </div>


        <!-- MESSAGE -->
        <p
          id="password-message"
          class="form-message"
          role="status"
          aria-live="polite">
        </p>


        <!-- UPDATE BUTTON -->
        <button type="submit" class="home-button">
          Update Password
        </button>

      </form>


      <p class="form-footer">
        <a href="profile.html">← Back to My Profile</a>
      </p>

    </section>

  </main>


  <!-- FOOTER -->
  <footer class="site-footer">

    <p>
      &copy;
      <span id="currentYear"></span>
      Petros Curious Mind. All rights reserved.
    </p>

    <div class="footer-links">
      <a href="privacy.html">Privacy Policy</a>
      <a href="terms.html">Terms and Conditions</a>
    </div>

  </footer>


  <!-- JAVASCRIPT -->
  <script src="js/main.js"></script>

  <script>

    const passwordForm =
      document.getElementById("password-form");

    const passwordMessage =
      document.getElementById("password-message");


    // SHOW OR HIDE PASSWORDS
    document.getElementById("show-password")
      .addEventListener("change", function() {

        const passwordFields = [
          document.getElementById("current-password"),
          document.getElementById("new-password"),
          document.getElementById("confirm-password")
        ];

        passwordFields.forEach(function(field) {

          field.type = this.checked ? "text" : "password";

        }, this);

      });


    // FORM VALIDATION
    passwordForm.addEventListener("submit", function(event) {

      event.preventDefault();

      const currentPassword =
        document.getElementById("current-password").value;

      const newPassword =
        document.getElementById("new-password").value;

      const confirmPassword =
        document.getElementById("confirm-password").value;


      if (newPassword.length < 8) {

        passwordMessage.textContent =
          "Your new password must be at least 8 characters long.";

        return;

      }


      if (newPassword !== confirmPassword) {

        passwordMessage.textContent =
          "Your new passwords do not match.";

        return;

      }


      if (currentPassword === newPassword) {

        passwordMessage.textContent =
          "Your new password must be different from your current password.";

        return;

      }


      passwordMessage.textContent =
        "Password validation successful. Actual password changes will be available after backend authentication is connected.";

    });

  </script>

</body>
</html>
