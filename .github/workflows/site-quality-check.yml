name: Site quality checks

on:
  push:
    branches: [main]
    paths:
      - "**/*.js"
      - "*.html"
      - "**/*.html"
      - "css/**"
      - ".github/workflows/site-quality-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: |
          set -e
          find js -type f -name "*.js" -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Check HTML IDs and local links
        run: |
          python3 <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit
          import subprocess
          import tempfile

          failures = []

          class PageAudit(HTMLParser):
              def __init__(self, page):
                  super().__init__(convert_charrefs=True)
                  self.page = page
                  self.ids = set()
                  self.inline_script = None
                  self.script_type = ""
                  self.script_number = 0

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  element_id = attrs.get("id")
                  if element_id:
                      if element_id in self.ids:
                          failures.append(f"{self.page}: duplicate id '{element_id}'")
                      self.ids.add(element_id)

                  for attribute in ("href", "src"):
                      value = attrs.get(attribute, "").strip()
                      if not value or value.startswith(("#", "//")):
                          continue
                      parsed = urlsplit(value)
                      if parsed.scheme or not parsed.path:
                          continue
                      target = (self.page.parent / parsed.path).resolve()
                      if not target.exists():
                          failures.append(f"{self.page}: missing local {attribute} '{value}'")

                  if tag == "script":
                      self.script_type = attrs.get("type", "").lower()
                      self.inline_script = "" if not attrs.get("src") and self.script_type in ("", "text/javascript", "application/javascript") else None

              def handle_data(self, data):
                  if self.inline_script is not None:
                      self.inline_script += data

              def handle_endtag(self, tag):
                  if tag == "script" and self.inline_script is not None:
                      self.script_number += 1
                      with tempfile.NamedTemporaryFile("w", suffix=".js", encoding="utf-8") as temp:
                          temp.write(self.inline_script)
                          temp.flush()
                          result = subprocess.run(["node", "--check", temp.name], capture_output=True, text=True)
                          if result.returncode:
                              failures.append(f"{self.page}: inline script {self.script_number} has a syntax error: {result.stderr.strip()}")
                      self.inline_script = None

          pages = sorted(Path(".").glob("*.html"))
          for page in pages:
              audit = PageAudit(page)
              audit.feed(page.read_text(encoding="utf-8"))
              audit.close()

          if failures:
              print("\n".join(failures))
              raise SystemExit(1)
          print(f"Checked {len(pages)} HTML pages: no duplicate IDs, missing local links/assets, or inline JavaScript syntax errors.")
          PY

      - name: Check patch whitespace
        run: git diff --check
