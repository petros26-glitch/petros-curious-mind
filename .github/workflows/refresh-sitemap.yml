name: Refresh public story sitemap

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "js/supabase-client.js"
      - ".github/workflows/refresh-sitemap.yml"

permissions:
  contents: write

jobs:
  refresh-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Generate sitemap from published stories
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const source = fs.readFileSync("js/supabase-client.js", "utf8");
          const url = source.match(/url:\s*"([^"]+)"/)?.[1];
          const key = source.match(/publishableKey:\s*"([^"]+)"/)?.[1];
          if (!url || !key) throw new Error("Could not read the Supabase public client configuration.");

          const response = await fetch(
            url.replace(/\/$/, "") + "/rest/v1/stories?select=slug,published_at&published=eq.true&order=published_at.desc",
            { headers: { apikey: key, Accept: "application/json" } }
          );
          if (!response.ok) throw new Error("Supabase returned HTTP " + response.status);
          const stories = await response.json();

          const base = "https://petroscuriousmind.name.ng";
          const urls = [
            { loc: base + "/", priority: "1.0" },
            { loc: base + "/stories.html", priority: "0.9" },
            { loc: base + "/about.html", priority: "0.5" },
            { loc: base + "/contact.html", priority: "0.4" },
            { loc: base + "/privacy.html", priority: "0.2" },
            { loc: base + "/terms.html", priority: "0.2" },
            ...stories.filter((story) => story.slug).map((story) => ({
              loc: base + "/story.html?slug=" + encodeURIComponent(story.slug),
              lastmod: story.published_at ? new Date(story.published_at).toISOString().slice(0, 10) : undefined,
              priority: "0.8"
            }))
          ];
          const xml = (value) => String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&apos;");
          const body = [
            '<?xml version="1.0" encoding="UTF-8"?>',
            '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">',
            ...urls.map((item) => [
              "  <url>",
              "    <loc>" + xml(item.loc) + "</loc>",
              item.lastmod ? "    <lastmod>" + xml(item.lastmod) + "</lastmod>" : "",
              "    <priority>" + item.priority + "</priority>",
              "  </url>"
            ].filter(Boolean).join("\n")),
            "</urlset>",
            ""
          ].join("\n");
          fs.writeFileSync("sitemap.xml", body);
          console.log("Generated sitemap for " + stories.length + " published stories.");
          NODE

      - name: Commit sitemap when it changes
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "Sitemap is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Refresh sitemap with published stories"
          git push
