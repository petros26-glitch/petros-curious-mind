name: Generate static story pages and sitemap

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "story.html"
      - "js/content.js"
      - "js/supabase-client.js"
      - "scripts/generate-story-pages.mjs"
      - ".github/workflows/refresh-sitemap.yml"

permissions:
  contents: write

concurrency:
  group: generate-static-story-pages-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate static story pages and sitemap
        run: node scripts/generate-story-pages.mjs

      - name: Commit generated pages when changed
        run: |
          git add -A -- stories sitemap.xml
          if git diff --cached --quiet; then
            echo "Static story pages and sitemap are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate static story preview pages"
          git push
