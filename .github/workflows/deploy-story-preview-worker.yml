name: Deploy story preview Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/story-preview/**"
      - ".github/workflows/deploy-story-preview-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcm-story-preview-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Worker JavaScript syntax
        run: node --check workers/story-preview/src/index.js

      - name: Deploy Worker and routes
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/story-preview
          command: deploy

      - name: Set the Supabase publishable key as a Worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          printf '%s' "$SUPABASE_PUBLISHABLE_KEY" | npx --yes wrangler@4 secret put SUPABASE_PUBLISHABLE_KEY --config workers/story-preview/wrangler.toml
