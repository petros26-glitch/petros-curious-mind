name: Remove retired story preview Worker

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-story-preview-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remove-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Remove Cloudflare Worker and its configured routes
        working-directory: workers/story-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 delete --name pcm-story-previews --force --config wrangler.toml
