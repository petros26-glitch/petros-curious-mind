name: Deploy story preview Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/story-preview/**"
      - ".github/workflows/deploy-story-preview-worker.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "workers/story-preview/**"
      - ".github/workflows/deploy-story-preview-worker.yml"

permissions:
  contents: read

concurrency:
  group: pcm-story-preview-worker-production
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Worker JavaScript syntax
        run: node --check workers/story-preview/src/index.js
      - name: Validate Wrangler configuration without deploying
        run: npx --yes wrangler@4 deploy --dry-run --config workers/story-preview/wrangler.toml

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Worker JavaScript syntax
        run: node --check workers/story-preview/src/index.js

      - name: Validate Wrangler configuration without deploying
        run: npx --yes wrangler@4 deploy --dry-run --config workers/story-preview/wrangler.toml

      - name: Deploy Worker and routes
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/story-preview
          command: deploy
