name: Social preview checks

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/social-preview-check.yml"
      - "workers/story-preview/**"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: pcm-social-preview-checks
  cancel-in-progress: true

jobs:
  check-previews:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check live homepage and story previews as a social crawler
        env:
          SITE: https://petroscuriousmind.name.ng
        run: |
          python3 <<'PY'
          from html.parser import HTMLParser
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          from urllib.parse import urljoin
          import sys, time

          SITE = "https://petroscuriousmind.name.ng"
          USER_AGENT = "facebookexternalhit/1.1 (+https://www.facebook.com/externalhit_uatext.php)"
          failures = []

          class MetaParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.meta = {}
                  self.canonical = ""
                  self.title = ""
                  self.in_title = False

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "meta":
                      key = attrs.get("property") or attrs.get("name")
                      if key:
                          self.meta[key.lower()] = attrs.get("content", "")
                  elif tag == "link" and attrs.get("rel", "").lower() == "canonical":
                      self.canonical = attrs.get("href", "")
                  elif tag == "title":
                      self.in_title = True

              def handle_data(self, data):
                  if self.in_title:
                      self.title += data

              def handle_endtag(self, tag):
                  if tag == "title":
                      self.in_title = False

          def fetch(url, headers=None):
              req = Request(url, headers={"User-Agent": USER_AGENT, "Cache-Control": "no-cache", "Pragma": "no-cache", **(headers or {})})
              with urlopen(req, timeout=20) as response:
                  return response.status, response.headers, response.read()

          def check_page(label, path, expected_title=None, require_story_image=False):
              url = path if path.startswith("https://") else SITE + path
              separator = "&" if "?" in url else "?"
              url += separator + "pcm_cache_bust=" + str(time.time_ns())
              print(f"\nChecking {label}: {url}")
              try:
                  status, headers, body = fetch(url)
              except Exception as exc:
                  failures.append(f"{label}: page request failed: {exc}")
                  print(f"FAIL page request: {exc}")
                  return

              if status != 200:
                  failures.append(f"{label}: expected HTTP 200, got {status}")
              if "text/html" not in headers.get("Content-Type", ""):
                  failures.append(f"{label}: response is not HTML ({headers.get('Content-Type')})")

              parser = MetaParser()
              parser.feed(body.decode("utf-8", errors="replace"))
              title = parser.meta.get("og:title", "")
              image = parser.meta.get("og:image", "")
              description = parser.meta.get("og:description", "")
              og_url = parser.meta.get("og:url", "")
              og_type = parser.meta.get("og:type", "")

              print(f"HTTP: {status}")
              print(f"x-pcm-worker: {headers.get('x-pcm-worker', '')}")
              print(f"x-pcm-preview: {headers.get('x-pcm-preview', '')}")
              print(f"server: {headers.get('Server', '')}")
              print(f"cf-ray: {headers.get('CF-Ray', '')}")
              print(f"cf-cache-status: {headers.get('CF-Cache-Status', '')}")
              print(f"cf-worker: {headers.get('CF-Worker', '')}")
              print(f"content-type: {headers.get('Content-Type', '')}")
              print(f"og:title: {title}")
              print(f"og:image: {image}")
              print(f"og:type: {og_type}")
              print(f"og:url: {og_url}")
              print(f"canonical: {parser.canonical}")

              if not title:
                  failures.append(f"{label}: missing og:title")
              if not description:
                  failures.append(f"{label}: missing og:description")
              if not image.startswith("https://"):
                  failures.append(f"{label}: missing or non-HTTPS og:image")
              if not og_url.startswith(SITE):
                  failures.append(f"{label}: incorrect or missing og:url")
              if parser.canonical != og_url:
                  failures.append(f"{label}: canonical URL does not match og:url")
              if expected_title and expected_title.lower() not in title.lower():
                  failures.append(f"{label}: title does not contain expected text '{expected_title}'")
              if require_story_image:
                  if "blogger.googleusercontent.com" not in image:
                      failures.append(f"{label}: expected its Blogger cover image, got {image}")
                  if image.rstrip("/") == (SITE + "/images/logo.png"):
                      failures.append(f"{label}: incorrectly using homepage logo as story image")

              if image.startswith("https://"):
                  try:
                      image_status, image_headers, _ = fetch(image, {"Range": "bytes=0-0"})
                      image_type = image_headers.get("Content-Type", "")
                      print(f"Image response: {image_status} ({image_type})")
                      if image_status not in (200, 206) or not image_type.startswith("image/"):
                          failures.append(f"{label}: og:image URL did not return an image (HTTP {image_status}, {image_type})")
                  except Exception as exc:
                      failures.append(f"{label}: og:image could not be fetched: {exc}")

          check_page("Homepage", "/", "Petros Curious Mind")
          check_page("WWW homepage route probe", "https://www.petroscuriousmind.name.ng/", "Petros Curious Mind")
          check_page("Direct Worker homepage probe", "https://pcm-story-previews.petroscuriousmind1.workers.dev/", "Petros Curious Mind")
          check_page("Direct Worker story probe", "https://pcm-story-previews.petroscuriousmind1.workers.dev/story.html?slug=the-woman-in-the-woods-c261fe", "THE WOMAN IN THE WOODS", True)
          check_page("The Woman in the Woods", "/story.html?slug=the-woman-in-the-woods-c261fe", "THE WOMAN IN THE WOODS", True)
          check_page("The Eradication of Dragons", "/story.html?slug=the-eradication-of-dragons-3a060b", "THE ERADICATION OF DRAGONS", True)

          if failures:
              print("\nSOCIAL PREVIEW CHECK: FAILED")
              for failure in failures:
                  print(" - " + failure)
              sys.exit(1)

          print("\nSOCIAL PREVIEW CHECK: PASSED — homepage and both story images/titles are reachable.")
          PY
